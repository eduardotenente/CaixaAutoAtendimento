<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAtendimento</title>
    <link rel="stylesheet" href="assets/css/index.css">
    <script src="assets/js/calc.js" defer></script>
    <script src="assets/js/dom.js" defer></script>
</head>
<body>
    <header>
        <img src="assets/media/images/logo.png" alt="logo">
        <h1>Loja Fácil</h1>
        <nav>
            <h2>Caixa de Auto Atendimento</h2>
            <!-- ICONE -->
        </nav>
    </header>

    <main id="main-content">
        <section id="welcome-section">
            <!-- IMAGEM -->
            <h2>Bem-vindo(a)!</h2>
            <p>Aqui você pode consultar nossos produtos, calcular sua compra e aproveitar nossos descontos.</p>
        </section>
        <section id="product-section">
            <h2>Nossos Produtos</h2>
            <div class="product_list">
                 <label for="product-1"><!-- Refrigerante --></label>
                 <input type="radio" name="product" id="product-1">
                 <label for="product-2"><!-- Água --></label>
                 <input type="radio" name="product" id="product-2">
                 <label for="product-3"><!-- Biscoito --></label>
                 <input type="radio" name="product" id="product-3">
                 <label for="product-4"><!-- Chocolate --></label>
                 <input type="radio" name="product" id="product-4">
                 <label for="product-5"><!-- Sorvete --></label>
                 <input type="radio" name="product" id="product-5">
            </div>
            <div class="product_info">
                <!-- ICONE -->
                <p id="info">Selecione um produto para continuar.</p>
                <button id="submit-product">Escolher Produto</button>
            </div>
        </section>
    </main>
</body>
</html>
